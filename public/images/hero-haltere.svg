<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-label="Haltère Zenin">
  <defs>
    <linearGradient id="concrete" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#44403c"/>
      <stop offset="50%" style="stop-color:#292524"/>
      <stop offset="100%" style="stop-color:#1c1917"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#78716c" stop-opacity="0.35"/>
      <stop offset="100%" style="stop-color:#292524" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Corps central -->
  <rect x="168" y="248" width="104" height="64" rx="6" fill="url(#concrete)"/>
  <rect x="168" y="248" width="104" height="64" rx="6" fill="url(#sheen)"/>
  <!-- Tête gauche -->
  <rect x="48" y="200" width="120" height="160" rx="10" fill="url(#concrete)"/>
  <rect x="48" y="200" width="40" height="160" rx="10" fill="url(#sheen)"/>
  <!-- Tête droite -->
  <rect x="272" y="200" width="120" height="160" rx="10" fill="url(#concrete)"/>
  <rect x="352" y="200" width="40" height="160" rx="10" fill="url(#sheen)"/>
  <!-- Poignée -->
  <rect x="188" y="268" width="64" height="24" rx="4" fill="#1c1917" opacity="0.5"/>
</svg>
